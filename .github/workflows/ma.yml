name: Build S22 Kernel (Non-GKI Custom)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kernel_platform/**'
      - 'msm-kernel/**'
      - 'build_custom.sh'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libssl-dev \
            libncurses5-dev libelf-dev binutils-dev \
            clang lld llvm device-tree-compiler \
            lz4 ccache libfdt-dev git

      - name: Setup Swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sleep 1
          sudo fallocate -l 20G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=20480 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fix Defconfig Symlink
        run: |
          CONFIG_DIR="kernel_platform/msm-kernel/arch/arm64/configs/vendor"
          if [ -f "$CONFIG_DIR/waipio_sec_defconfig" ]; then
            cd "$CONFIG_DIR"
            ln -sf waipio_sec_defconfig waipio_sec__defconfig 2>/dev/null || true
            echo "✅ Symlink criado"
            ls -la waipio_sec*defconfig
          fi

      - name: Setup Clang Toolchain
        run: |
          mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86
          cd kernel_platform/prebuilts-master/clang/host/linux-x86
          
          if [ ! -d "clang-r416183b" ]; then
            echo "📥 Baixando Clang..."
            wget -q --show-progress \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz \
              -O clang.tar.gz
            mkdir -p clang-r416183b
            tar -C clang-r416183b -xzf clang.tar.gz
            rm clang.tar.gz
          fi
          
          echo "✅ Clang disponível:"
          ls clang-r416183b/bin/clang

      - name: Run Custom Build Script
        run: |
          chmod +x build_custom.sh
          ./build_custom.sh 2>&1 | tee build.log

      - name: List Output Files
        if: always()
        run: |
          echo "📂 Arquivos gerados:"
          find out/ -type f \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" \) 2>/dev/null | while read f; do
            ls -lh "$f"
          done

      - name: Compress Output
        if: always()
        run: |
          if [ -d "out/" ] && [ "$(ls -A out/ 2>/dev/null)" ]; then
            tar -czf out.tar.gz out/
            ls -lh out.tar.gz
          else
            echo "Nenhum output" > out.txt
            tar -czf out.tar.gz out.txt
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s22-kernel-non-gki-${{ github.run_number }}
          path: |
            out.tar.gz
            build.log
          retention-days: 7
          if-no-files-found: warn

