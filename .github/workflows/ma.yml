name: Build Waipio Kernel (S22)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante de build'
        required: true
        default: 'consolidate'
        type: choice
        options:
          - consolidate
          - gki
      clean_build:
        description: 'Fazer build limpo'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - 'kernel_platform/**'
      - 'build_kernel_GKI.sh'

env:
  CLANG_VERSION: clang-r416183b

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      matrix:
        variant: [consolidate, gki]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev \
            libncurses5-dev libelf-dev device-tree-compiler \
            lz4 ccache python3 libfdt-dev git wget tar

      - name: Setup Swap
        run: |
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: kernel_platform/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-${{ runner.os }}

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86
          cd kernel_platform/prebuilts-master/clang/host/linux-x86
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
          mkdir -p ${{ env.CLANG_VERSION }}
          tar -C ${{ env.CLANG_VERSION }} -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Setup Tools
        run: |
          mkdir -p kernel_platform/prebuilts/build-tools/linux-x86/bin
          for tool in bison flex m4 dtc; do
            if command -v $tool &> /dev/null; then
              ln -sf $(which $tool) kernel_platform/prebuilts/build-tools/linux-x86/bin/$tool
            fi
          done

          if command -v fdtoverlay &> /dev/null; then
            sudo ln -sf $(which fdtoverlay) /usr/local/bin/ufdt_apply_overlay
          fi

      - name: Setup ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          ccache -s

      - name: Prepare Environment
        run: |
          CLANG_BIN="${GITHUB_WORKSPACE}/kernel_platform/prebuilts-master/clang/host/linux-x86/${CLANG_VERSION}/bin"

          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "PATH=$CLANG_BIN:/usr/lib/ccache:$PATH" >> $GITHUB_ENV

          echo "MAKEFLAGS=-j$(nproc --all)" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CC=$CLANG_BIN/clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV

          echo "VARIANT=${{ matrix.variant }}" >> $GITHUB_ENV

          if [ "${{ inputs.clean_build }}" == "true" ]; then
            echo "SKIP_MRPROPER=0" >> $GITHUB_ENV
          else
            echo "SKIP_MRPROPER=1" >> $GITHUB_ENV
          fi

      - name: Build Kernel
        run: |
          echo "🚀 Building Waipio ($VARIANT)"

          export OUT_DIR="${GITHUB_WORKSPACE}/out/msm-waipio-$VARIANT"
          mkdir -p "$OUT_DIR"

          export ROOT_DIR="${GITHUB_WORKSPACE}/kernel_platform"
          export KERNEL_DIR="msm-kernel"
          export COMMON_OUT_DIR="$OUT_DIR"
          export BUILD_CONFIG="kernel_platform/msm-kernel/build.config.msm.waipio"

          if [ ! -f "$BUILD_CONFIG" ]; then
            echo "❌ build.config.msm.waipio não encontrado"
            exit 1
          fi

          timeout 10800 bash -c "
            set -e
            source $BUILD_CONFIG
            make -C kernel_platform/msm-kernel O=\$OUT_DIR
          " 2>&1 | tee "build_$VARIANT.log"

      - name: List Outputs
        if: always()
        run: |
          echo "📦 Arquivos gerados:"
          find out -type f 2>/dev/null | head -50

      - name: Package
        if: success()
        run: |
          mkdir -p release/waipio-$VARIANT
          cp -r out release/waipio-$VARIANT/

          cd release
          tar -czf waipio-$VARIANT.tar.gz waipio-$VARIANT
          ls -lh waipio-$VARIANT.tar.gz

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waipio-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            release/waipio-${{ matrix.variant }}.tar.gz
            build_${{ matrix.variant }}.log
          retention-days: 14
          if-no-files-found: warn

  create-release:
    needs: build
    runs-on: ubuntu-24.04
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Unified Package
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: waipio-release-${{ github.run_number }}
          path: release/*
          retention-days: 30