name: Build Waipio Kernel (S22)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante de build'
        required: true
        default: 'consolidate'
        type: choice
        options:
          - consolidate
          - gki
      clean_build:
        description: 'Fazer build limpo'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - 'kernel_platform/**'
      - 'build_kernel_GKI.sh'

env:
  CLANG_VERSION: clang-r416183b

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      matrix:
        variant: [consolidate, gki]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev \
            libncurses5-dev libelf-dev binutils-dev device-tree-compiler \
            lz4 ccache python3 libfdt-dev git wget tar

      - name: Setup Swap
        run: |
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: kernel_platform/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-${{ runner.os }}-v2

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86
          cd kernel_platform/prebuilts-master/clang/host/linux-x86
          wget -q --show-progress --timeout=300 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
          mkdir -p ${{ env.CLANG_VERSION }}
          tar -C ${{ env.CLANG_VERSION }} -xzf clang.tar.gz
          rm clang.tar.gz
          echo "✅ Clang instalado"
          ls -la ${{ env.CLANG_VERSION }}/bin/clang

      - name: Setup Build Tools
        run: |
          echo "🔧 Configurando ferramentas de build..."
          
          # Remover paths problemáticos
          if [ -d "kernel_platform/build/build-tools/path/linux-x86" ]; then
            rm -rf kernel_platform/build/build-tools/path/linux-x86
          fi
          
          # Criar diretório para ferramentas
          mkdir -p kernel_platform/prebuilts/build-tools/linux-x86/bin
          
          # Criar symlinks
          for tool in bison flex m4 dtc; do
            if command -v $tool &> /dev/null; then
              ln -sf $(which $tool) kernel_platform/prebuilts/build-tools/linux-x86/bin/$tool 2>/dev/null || true
              echo "✅ $tool linkado"
            fi
          done
          
          # ufdt_apply_overlay
          if command -v fdtoverlay > /dev/null 2>&1; then
            sudo ln -sf $(which fdtoverlay) /usr/local/bin/ufdt_apply_overlay
            echo "✅ ufdt_apply_overlay criado"
          fi

      - name: Fix Defconfigs
        run: |
          echo "🔧 Corrigindo defconfigs..."
          cd kernel_platform/msm-kernel/arch/arm64/configs/vendor 2>/dev/null || exit 0
          
          for cfg in waipio_sec_defconfig waipio_gki_defconfig; do
            if [ -f "$cfg" ]; then
              double_underscore="${cfg/_defconfig/__defconfig}"
              if [ ! -f "$double_underscore" ]; then
                ln -sf "$cfg" "$double_underscore"
                echo "✅ $double_underscore -> $cfg"
              fi
            fi
          done
          
          ls -la *waipio*defconfig 2>/dev/null || echo "⚠️ Nenhum defconfig waipio encontrado"

      - name: Setup Build Environment
        run: |
          echo "🔧 Configurando variáveis de ambiente..."
          
          # Configurar paths
          echo "ROOT_DIR=${GITHUB_WORKSPACE}/kernel_platform" >> $GITHUB_ENV
          echo "KERNEL_DIR=msm-kernel" >> $GITHUB_ENV
          echo "COMMON_OUT_DIR=${GITHUB_WORKSPACE}/out" >> $GITHUB_ENV
          echo "OUT_DIR=${GITHUB_WORKSPACE}/out" >> $GITHUB_ENV
          
          # Configurar Clang
          CLANG_BIN="${GITHUB_WORKSPACE}/kernel_platform/prebuilts-master/clang/host/linux-x86/${CLANG_VERSION}/bin"
          echo "CLANG_PREBUILT_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "PATH=$CLANG_BIN:$PATH" >> $GITHUB_ENV
          
          # Configurar variáveis do build
          echo "VARIANT=${{ matrix.variant }}" >> $GITHUB_ENV
          echo "MSM_ARCH=waipio" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "HERMETIC_TOOLCHAIN=0" >> $GITHUB_ENV
          echo "BUILD_VENDOR_DLKM=1" >> $GITHUB_ENV
          echo "DT_OVERLAY_SUPPORT=1" >> $GITHUB_ENV
          echo "TRIM_UNUSED_MODULES=1" >> $GITHUB_ENV
          
          # Clean build
          if [ "${{ inputs.clean_build }}" == "true" ]; then
            echo "SKIP_MRPROPER=0" >> $GITHUB_ENV
          else
            echo "SKIP_MRPROPER=1" >> $GITHUB_ENV
          fi
          
          echo "✅ Variáveis configuradas"

      - name: Verify Environment
        run: |
          echo "========================================"
          echo "📋 Verificação do ambiente"
          echo "========================================"
          echo "ROOT_DIR: $ROOT_DIR"
          echo "KERNEL_DIR: $KERNEL_DIR"
          echo "VARIANT: $VARIANT"
          echo ""
          echo "Clang:"
          $CLANG_PREBUILT_BIN/clang --version | head -1
          echo ""
          echo "Verificando arquivos:"
          ls -la $ROOT_DIR/$KERNEL_DIR/build.config.msm.waipio 2>/dev/null || echo "❌ build.config.msm.waipio não encontrado"
          ls -la $ROOT_DIR/$KERNEL_DIR/build.config.msm.common 2>/dev/null || echo "❌ build.config.msm.common não encontrado"

      - name: Build Kernel
        run: |
          echo "🚀 Iniciando build do kernel Waipio ($VARIANT)..."
          echo "========================================"
          
          # Criar diretório de saída
          mkdir -p $OUT_DIR
          
          # Navegar para o diretório correto
          cd $ROOT_DIR
          
          echo "📁 Diretório atual: $(pwd)"
          echo "📁 ROOT_DIR: $ROOT_DIR"
          echo "📁 KERNEL_DIR: $KERNEL_DIR"
          echo "📁 OUT_DIR: $OUT_DIR"
          
          # Verificar se os arquivos de configuração existem
          if [ ! -f "$KERNEL_DIR/build.config.msm.waipio" ]; then
            echo "❌ Arquivo não encontrado: $KERNEL_DIR/build.config.msm.waipio"
            echo "📁 Conteúdo do diretório:"
            ls -la $KERNEL_DIR/ | head -20
            exit 1
          fi
          
          # Executar o build.config.msm.waipio
          echo "📖 Sourcing build.config.msm.waipio..."
          set -a  # Exportar todas as variáveis
          source $KERNEL_DIR/build.config.msm.waipio
          set +a
          
          echo "✅ Configuração carregada"
          
          # Verificar se as funções de build existem
          if type make_defconfig &>/dev/null; then
            echo "🔨 Executando make_defconfig..."
            make_defconfig
          else
            echo "⚠️ make_defconfig não encontrado, usando make direto..."
            make -C $KERNEL_DIR O=$OUT_DIR ARCH=arm64 ${DEFCONFIG:-waipio_sec_defconfig}
          fi
          
          if type make_kernel &>/dev/null; then
            echo "🔨 Executando make_kernel..."
            make_kernel
          else
            echo "⚠️ make_kernel não encontrado, usando make direto..."
            make -C $KERNEL_DIR O=$OUT_DIR ARCH=arm64 -j$(nproc)
          fi
          
          echo "✅ Build concluído!"
        shell: bash
        continue-on-error: true

      - name: Build with Script (Fallback)
        if: failure()
        run: |
          echo "🔄 Tentando build com script alternativo..."
          
          export VARIANT=${{ matrix.variant }}
          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/kernel_platform/prebuilts-master/clang/host/linux-x86/${CLANG_VERSION}/bin"
          export PATH="$CLANG_PREBUILT_BIN:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          
          cd ${GITHUB_WORKSPACE}
          
          if [ -f "build_kernel_GKI.sh" ]; then
            echo "📜 Executando build_kernel_GKI.sh..."
            chmod +x build_kernel_GKI.sh
            ./build_kernel_GKI.sh 2>&1 | tee build_${{ matrix.variant }}.log
          else
            echo "❌ Script de build não encontrado"
            exit 1
          fi

      - name: List Outputs
        if: always()
        run: |
          echo "========================================"
          echo "📂 Arquivos gerados"
          echo "========================================"
          
          if [ -d "out" ]; then
            echo "📁 Imagens do kernel:"
            find out -type f \( -name "Image*" -o -name "*.dtb" -o -name "*.img" -o -name "*.dtbo" \) 2>/dev/null | while read f; do
              echo "  $(ls -lh "$f")"
            done
            
            echo ""
            echo "📁 Módulos (.ko):"
            find out -name "*.ko" 2>/dev/null | wc -l | xargs echo "  Total:"
            
            echo ""
            echo "📁 Tamanho total:"
            du -sh out/ 2>/dev/null || echo "N/A"
          else
            echo "⚠️ Diretório out/ não encontrado"
          fi

      - name: Package Artifacts
        if: always()
        run: |
          echo "📦 Empacotando artifacts..."
          
          mkdir -p release
          
          if [ -d "out" ] && [ "$(ls -A out/ 2>/dev/null)" ]; then
            tar -czf release/waipio-${{ matrix.variant }}.tar.gz out/
            ls -lh release/
          else
            echo "⚠️ Nada para empacotar"
            echo "Nenhum arquivo gerado" > release/empty.txt
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waipio-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            release/*.tar.gz
            release/*.txt
            build_*.log
          if-no-files-found: ignore
          retention-days: 14
