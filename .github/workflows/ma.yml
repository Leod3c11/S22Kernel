name: Build Waipio Kernel (S22)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante de build'
        required: true
        default: 'consolidate'
        type: choice
        options:
          - consolidate
          - gki

  push:
    branches:
      - main
    paths:
      - 'kernel_platform/**'

env:
  CLANG_VERSION: clang-r416183b

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      matrix:
        variant: [consolidate]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev \
            libncurses5-dev libelf-dev device-tree-compiler \
            lz4 ccache python3 libfdt-dev git wget tar rsync \
            coreutils sed

      - name: Setup Swap (16GB)
        run: |
          echo "🧠 Configurando swap..."
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: kernel_platform/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-${{ runner.os }}

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86
          cd kernel_platform/prebuilts-master/clang/host/linux-x86
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/${CLANG_VERSION}.tar.gz -O clang.tar.gz
          mkdir -p ${CLANG_VERSION}
          tar -C ${CLANG_VERSION} -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Setup Environment
        run: |
          CLANG_BIN="${GITHUB_WORKSPACE}/kernel_platform/prebuilts-master/clang/host/linux-x86/${CLANG_VERSION}/bin"

          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "VARIANT=${{ github.event.inputs.variant || 'consolidate' }}" >> $GITHUB_ENV

      - name: Build Kernel (ACK Correct Way)
        run: |
          echo "🚀 Building Waipio ($VARIANT)"

          cd kernel_platform

          # 🔥 PATH preservando sistema
          export PATH=${CLANG_BIN}:/usr/bin:/bin:/usr/sbin:/sbin:$PATH

          export BUILD_CONFIG=msm-kernel/build.config.msm.waipio
          export OUT_DIR=${GITHUB_WORKSPACE}/out/msm-waipio-$VARIANT
          export DIST_DIR=$OUT_DIR/dist

          mkdir -p "$OUT_DIR"

          if [ ! -f "$BUILD_CONFIG" ]; then
            echo "❌ build.config.msm.waipio não encontrado"
            exit 1
          fi

          timeout 10800 ./build/build.sh 2>&1 | tee ${GITHUB_WORKSPACE}/build.log

      - name: Show Output Files
        if: always()
        run: |
          echo "📦 Arquivos gerados:"
          find out -type f | head -50

      - name: Package
        if: success()
        run: |
          mkdir -p release
          cp -r out/msm-waipio-* release/
          cd release
          tar -czf waipio-build-${{ github.run_number }}.tar.gz *
          ls -lh

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waipio-build-${{ github.run_number }}
          path: |
            release/*.tar.gz
            build.log
          retention-days: 14
          if-no-files-found: warn