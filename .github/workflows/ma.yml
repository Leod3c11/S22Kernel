name: Build Waipio Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig_name:
        description: 'Nome do defconfig (ex: waipio_sec_defconfig)'
        required: true
        default: 'waipio_sec_defconfig'
      build_variant:
        description: 'Variante de build (ex: user, userdebug, eng)'
        required: true
        default: 'userdebug'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Instalar dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev python3 python3-pip bc cpio android-sdk-libsparse-utils
        # Instalar toolchain GNU (gcc-aarch64-linux-gnu e gcc-arm-linux-gnueabi)
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Baixar e configurar o Clang do Android NDK
      run: |
        # Versão do NDK recomendada para kernels Android modernos
        NDK_VERSION=25.2.9519653
        NDK_URL="https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip"
        wget -q ${NDK_URL}
        unzip -q android-ndk-r${NDK_VERSION}-linux.zip
        export PATH="$(pwd)/android-ndk-r${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        echo "PATH=$(pwd)/android-ndk-r${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Configurar e compilar o kernel
      run: |
        export ROOT_DIR=$(pwd)
        export KERNEL_DIR=${ROOT_DIR}/kernel_platform/msm-kernel
        export OUT_DIR=${ROOT_DIR}/out
        export ARCH=arm64
        export SUBARCH=arm64
        export DEFCONFIG_BASE="vendor/${{ github.event.inputs.defconfig_name }}"
        export TARGET_BUILD_VARIANT=${{ github.event.inputs.build_variant }}

        mkdir -p ${OUT_DIR}

        echo "Iniciando compilação do kernel com defconfig: ${DEFCONFIG_BASE}"

        # Limpar (opcional, mas recomendado para builds limpos)
        make -C ${KERNEL_DIR} O=${OUT_DIR} clean

        # Gerar .config
        make -C ${KERNEL_DIR} O=${OUT_DIR} ${DEFCONFIG_BASE}

        # Aplicar configurações adicionais do build.config
        # O script build_custom.sh faz isso automaticamente ao ser executado
        # Mas para um workflow mais genérico, podemos simular as etapas importantes
        # do build_custom.sh aqui, ou simplesmente chamar o build_custom.sh
        # Vou optar por chamar o build_custom.sh para manter a lógica original do repositório

        # Executar o script de build customizado
        chmod +x build_custom.sh
        ./build_custom.sh

    - name: Arquivar artefatos
      uses: actions/upload-artifact@v4
      with:
        name: waipio-kernel-build-artifacts
        path: |
          ${{ github.workspace }}/out/arch/arm64/boot/Image
          ${{ github.workspace }}/out/arch/arm64/boot/dtb.img
          ${{ github.workspace }}/out/arch/arm64/boot/dtbo.img
          ${{ github.workspace }}/out/arch/arm64/boot/vendor/qcom/*.dtbo
          ${{ github.workspace }}/out/.config
          ${{ github.workspace }}/out/System.map
          ${{ github.workspace }}/out/vmlinux
          ${{ github.workspace }}/out/modules/**/*.ko

    - name: Notificar sucesso
      run: echo "Compilação do kernel Waipio concluída com sucesso!"
