name: Build S22 Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kernel_platform/**'
      - 'msm-kernel/**'
      - 'build_kernel_GKI.sh'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev \
            libncurses5-dev libelf-dev binutils-dev clang lld llvm \
            device-tree-compiler lz4 ccache libfdt-dev git

      - name: Setup swap
        run: |
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Fix defconfig symlink
        run: |
          cd kernel_platform/msm-kernel/arch/arm64/configs/vendor
          ln -sf waipio_sec_defconfig waipio_sec__defconfig 2>/dev/null || true

      - name: Install ufdt_apply_overlay
        run: |
          cd /tmp
          git clone --depth=1 https://github.com/aosp-mirror/platform_system_libufdt
          cd platform_system_libufdt/utils/src
          clang -o ufdt_apply_overlay ufdt_apply_overlay.c -I../../include -lfdt || \
          gcc -o ufdt_apply_overlay ufdt_apply_overlay.c -I../../include -lfdt
          sudo cp ufdt_apply_overlay /usr/local/bin/

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b
          key: clang-r416183b-${{ runner.os }}

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86
          cd kernel_platform/prebuilts-master/clang/host/linux-x86
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz -O clang.tar.gz
          mkdir -p clang-r416183b
          tar -C clang-r416183b -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Build
        run: |
          export CLANG_PREBUILT_BIN="kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:${CLANG_PREBUILT_BIN}:${PATH}"
          export LLVM=1
          export LLVM_IAS=1
          export CC="${CLANG_PREBUILT_BIN}/clang"
          bash build_kernel_GKI.sh 2>&1 | tee build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_number }}
          path: |
            out.tar.gz
            build.log
          if-no-files-found: warn

